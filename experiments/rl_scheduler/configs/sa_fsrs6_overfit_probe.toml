schema_version = 1
name = "sa_fsrs6_overfit_probe"
family = "rl_scheduler"
seed = 42
output_root = "artifacts/rl_scheduler/sa_fsrs6_overfit_probe"
stages = ["dry-run", "preflight", "train-overfit"]

[users]
train = [1]
validation = [2, 3]
reserved_test = [4]

[baseline]
scheduler = "fsrs6"
log_root = "logs/retention_sweep"
expected_engine = "batched"
stage_mode = "copy"
desired_retention_values = [0.9]

[simulation]
engine = "batched"
environment = "lstm"
days = 365
deck = 5000
learn_limit = 10
review_limit = 9999
cost_limit_minutes = 720.0
priority = "new-first"
scheduler_priority = "low_retrievability"
short_term_source = "steps"
fuzz = false

[gpu_guard]
required = true
device = "cuda"
smoke = true

[performance]
device = "cuda"
memory_budget_fraction = 0.80
timeout_seconds = 900.0
progress_interval_seconds = 30.0
write_performance_summary = true
diagnostic_csv_logs = false

[training]
lambda_grid = [0.5]
artifact_metadata_glob = "metadata.json"
command_template = [
  "uv",
  "run",
  "python",
  "experiments/rl_scheduler/train_sa_fsrs6.py",
  "--config",
  "{config_path}",
  "--user-id",
  "{user_id}",
  "--lambda",
  "{lambda_value}",
  "--output-dir",
  "{output_dir}",
  "--training-command-path",
  "{command_record_path}",
]

[training.sa]
chains = 2048
iterations = 4
initial_temp = 0.05
final_temp = 0.005
proposal_scale = 0.35
coefficient_min = -8.0
coefficient_max = 8.0
retention_min = 0.70
retention_max = 0.98
baseline_desired_retention = 0.90
torch_device = "cuda"
short_term_threshold = 0.5
short_term_loops_limit = 10
