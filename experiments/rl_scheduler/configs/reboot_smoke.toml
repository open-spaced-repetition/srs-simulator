schema_version = 1
name = "rl_reboot_smoke"
family = "rl_scheduler"
seed = 42
output_root = "artifacts/rl_scheduler/reboot_smoke"
stages = ["dry-run", "preflight", "stage-baseline", "train-overfit", "sweep", "pareto"]

[users]
train = [1]
validation = [2, 3]
reserved_test = [4]

[baseline]
scheduler = "fsrs6"
log_root = "logs/retention_sweep"
expected_engine = "batched"
stage_mode = "copy"
desired_retention_values = [0.9]

[simulation]
engine = "batched"
days = 365
deck = 10000
learn_limit = 10
review_limit = 9999
cost_limit_minutes = 720.0
priority = "review-first"
scheduler_priority = "low_retrievability"
short_term_source = "steps"
fuzz = false

[gpu_guard]
required = false
device = "cpu"
smoke = false

[training]
lambda_grid = [0.0, 0.25, 0.5, 0.75, 1.0]
artifact_metadata_glob = "metadata.json"
# train-overfit requires a real trainer command before running this profile
# through --stage train-overfit or --stage all. Example shape:
# command_template = [
#   "uv",
#   "run",
#   "python",
#   "experiments/rl_scheduler/train_policy.py",
#   "--config",
#   "{config_path}",
#   "--user-id",
#   "{user_id}",
#   "--lambda",
#   "{lambda_value}",
#   "--output-dir",
#   "{output_dir}",
# ]

[pareto]
result_glob = "*.json"
plot_glob = "*.png"
# pareto requires a real comparison command after baseline staging and sweep pass.
# Example shape:
# command_template = [
#   "uv",
#   "run",
#   "python",
#   "experiments/retention_sweep/build_pareto.py",
#   "--log-dir",
#   "{sweep_outputs_dir}",
#   "--results-path",
#   "{output_dir}/pareto.json",
#   "--plot-dir",
#   "{output_dir}",
# ]

[sweep]
log_glob = "*.jsonl"
# sweep requires a real external evaluation command after train-overfit has
# emitted scheduler artifacts. Example shape:
# command_template = [
#   "uv",
#   "run",
#   "python",
#   "experiments/retention_sweep/run_sweep_users_batched.py",
#   "--start-user",
#   "{user_id}",
#   "--end-user",
#   "{user_id}",
#   "--sched",
#   "{scheduler_name}",
#   "--log-dir",
#   "{output_dir}",
# ]
