schema_version = 1
name = "fsrs6_oracle_stationary_finite_distill_portfolio_users_1_8_pop16_v1"
family = "rl_scheduler"
seed = 42
output_root = "artifacts/rl_scheduler/fsrs6_oracle_stationary_finite_distill_portfolio_users_1_8"
stages = [
  "dry-run",
  "preflight",
  "stage-baseline",
  "train-overfit",
  "sweep",
  "build-pareto",
  "analyze-pareto",
]

[users]
train = [
  1,
  2,
  3,
  4,
  5,
  6,
  7,
  8,
]
validation = []
reserved_test = []

[baseline]
scheduler = "fsrs6"
log_root = "logs/retention_sweep"
expected_engine = "batched"
stage_mode = "copy"
environments = ["fsrs6", "lstm"]

[baseline_dr_selection]
manifest = "artifacts/rl_scheduler/baseline_dr_selection/fsrs6_users_1_8_16dr_pop16_gen5.json"
selection_environment = "fsrs6"
target_count = 16
reference = "uniform_anchor"
population_size = 16
generations = 5

[simulation]
engine = "batched"
environment = "fsrs6"
days = 1825
deck = 10000
learn_limit = 10
review_limit = 9999
cost_limit_minutes = 720.0
priority = "new-first"
scheduler_priority = "low_retrievability"
fuzz = false

[gpu_guard]
required = true
device = "cuda"
smoke = true

[performance]
device = "cuda"
memory_budget_fraction = 0.80
timeout_seconds = 5400.0
progress_interval_seconds = 30.0
write_performance_summary = true
diagnostic_csv_logs = false

[training]
artifact_metadata_glob = "policies/**/metadata.json"
max_parallel_commands = 1
batch_baseline_desired_retention_values = true
command_template = [
  "uv",
  "run",
  "python",
  "experiments/rl_scheduler/train_fsrs6_oracle_stationary_finite_distill_portfolio.py",
  "--config",
  "{config_path}",
  "--user-id",
  "{user_id}",
  "--output-dir",
  "{output_dir}",
  "--training-command-path",
  "{command_record_path}",
]

[training.batch]
enabled = true
trainer = "auto"
max_lanes_per_batch = 6400

[training.policy_search]
retention_min = 0.50
retention_max = 0.98
baseline_desired_retention = 0.90
torch_device = "cuda"
short_term_threshold = 0.5
short_term_loops_limit = 10
distill_epochs = 128
distill_steps_per_epoch = 64
distill_supervision = "uniform_table"
distill_table_samples_per_weight = 64
distill_train_envs_per_user = 10000
distill_agreement_envs_per_user = 4096
distill_agreement_steps = 1
distill_network = "residual"
distill_hidden_size = 8
distill_network_depth = 2
distill_oracle_s_grid_size = 64
distill_oracle_d_grid_size = 32
distill_oracle_stationary_finite_max_iterations = 1000
distill_oracle_stationary_finite_tolerance = 0.000001
distill_oracle_teacher_user_batch_size = 0
distill_max_grad_norm = 1.0
distill_dp_cache_enabled = true
distill_dp_cache_dir = "artifacts/single_card_tradeoff/dp_cache"
distill_refresh_dp_cache = false
distill_no_progress = true
distill_goal_norm_max = 1024.0
distill_cost_weights = [0.0, 16.0, 64.0, 256.0, 1024.0]
distill_action_retentions = [
  0.50,
  0.60,
  0.65,
  0.70,
  0.75,
  0.80,
  0.85,
  0.90,
  0.93,
  0.96,
  0.98,
]

[training.portfolio]
algorithm = "sms_emoa"
population_size = 16
generations = 20
offspring_size = 16
portfolio_size = 16
mutation_scale = 0.20
reference_margin_fraction = 0.05
hv_epsilon = 0.0
min_goal_cost_weight = 0.0
max_goal_cost_weight = 1024.0
seed_cost_weights = [0.0, 16.0, 64.0, 256.0, 1024.0]

[sweep]
log_glob = "**/*.jsonl"
envs = ["fsrs6", "lstm"]
schedulers = ["fsrs6_oracle_stationary_finite_distill"]
run_id = "fsrs6_oracle_stationary_finite_distill_portfolio_users_1_8_pop16_v1"
fsrs6_oracle_stationary_finite_distill_train_run_root = "artifacts/rl_scheduler/fsrs6_oracle_stationary_finite_distill_portfolio_users_1_8/fsrs6_oracle_stationary_finite_distill_portfolio_users_1_8_pop16_v1"
log_dir = "logs/retention_sweep"
log_layout = "user"
batch_size = 8
max_lanes_per_batch = 1024
torch_device = "cuda"
benchmark_partition = "0"
start_retention = 0.50
end_retention = 0.98
step = 0.02
no_progress = true
no_log = false

[sweep.env_overrides.fsrs6]
max_lanes_per_batch = 8192

[sweep.env_overrides.lstm]
max_lanes_per_batch = 1024

[build_pareto]
envs = ["fsrs6", "lstm"]
schedulers = ["fsrs6", "fsrs6_oracle_stationary_finite_distill"]
log_dir = "logs/retention_sweep"
result_glob = "simulation_results_retention_sweep_user_*.json"
plot_glob = "*.png"
start_retention = 0.50
end_retention = 0.98
short_term = "off"
short_term_source = "any"
engine = "batched"
max_parallel = 8
compare_short_term = false
compare_engine = false
no_plot = false
hide_labels = true

[analyze_pareto]
envs = ["fsrs6", "lstm"]
schedulers = ["fsrs6", "fsrs6_oracle_stationary_finite_distill"]
comparisons = ["fsrs6_oracle_stationary_finite_distill:fsrs6"]
result_glob = "analysis.md"
start_retention = 0.50
end_retention = 0.98
short_term = "off"
engine = "batched"
fuzz = "off"
metric = "avg_accum_memorized_per_hour"
no_dedupe = false

[report]
enabled = true
output_path = "docs/rl_scheduler/experiments/2026-05-18-fsrs6_oracle_stationary_finite_distill_portfolio_users_1_8_pop16_v1.md"
comparison_run_root = "artifacts/rl_scheduler/fsrs6_adr_portfolio_users_1_8/fsrs6_adr_portfolio_users_1_8_pop16_v1"
candidate_label = "Oracle stationary finite distill"
comparison_label = "ADR"
question = "Evaluate whether per-user FSRS6 oracle stationary finite distill policies with searched goal-cost weights can match or improve the matched-budget FSRS6 ADR portfolio on external Pareto metrics."
