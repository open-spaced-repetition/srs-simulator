schema_version = 1

[users]
start = 1
end = 8

[sweep]
envs = ["fsrs6", "lstm"]
schedulers = ["sa_fsrs6_dr"]

[retention]
start = 0.50
end = 0.98
step = 0.02

[simulation]
days = 1825
deck = 10000
learn_limit = 10
review_limit = 9999
cost_limit_minutes = 720.0
seed = 42
priority = "new-first"
scheduler_priority = "low_retrievability"
fuzz = false

[paths]
log_dir = "logs/retention_sweep"
benchmark_partition = "0"

[execution]
batch_size = 8
torch_device = "cuda"

[logging]
log_layout = "user"
diagnostic_csv_logs = false
no_log = false
no_progress = false

[short_term]
threshold = 0.5
loops_limit = 10

[sa_fsrs6_dr]
train_run_root = "artifacts/rl_scheduler/sa_fsrs6_dr_fsrs6_users_1_8/fsrs6-dr-conditioned-users-1-8-v1"
lambda_values = [0.5]
