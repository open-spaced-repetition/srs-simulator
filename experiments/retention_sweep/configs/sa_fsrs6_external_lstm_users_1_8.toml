schema_version = 1

[users]
start = 1
end = 8

[sweep]
envs = ["lstm"]
schedulers = ["fsrs6", "sa_fsrs6"]

[retention]
start = 0.50
end = 0.98
step = 0.02

[simulation]
days = 1825
deck = 10000
learn_limit = 10
review_limit = 9999
cost_limit_minutes = 720.0
seed = 42
priority = "new-first"
scheduler_priority = "low_retrievability"
fuzz = false

[paths]
log_dir = "logs/retention_sweep"
benchmark_partition = "0"
# button_usage defaults to ../Anki-button-usage/button_usage.jsonl from the repo root.

[execution]
batch_size = 8
torch_device = "cuda"
# max_lanes_per_batch = 128

[logging]
log_layout = "user"
diagnostic_csv_logs = false
no_log = false
no_progress = false

[short_term]
# Omit source to keep short-term off.
threshold = 0.5
loops_limit = 10

[sa_fsrs6]
# Equivalent to policy_root = "<train_run_root>/train-overfit/train_outputs".
train_run_root = "artifacts/rl_scheduler/sa_fsrs6_fsrs6_dr_grid_users_1_16/fsrs6-dr-grid-users-1-16-v1"
lambda_values = [0.5]
