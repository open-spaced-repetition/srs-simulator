schema_version = 1
name = "distill_train_weights_1_4_control_markov_off"
family = "single_card_tradeoff"
seed = 42

[experiment]
env = "fsrs6"
user_ids = [1, 2, 3, 4, 5, 6, 7, 8]
button_usage = "../Anki-button-usage/button_usage.jsonl"
days = 1825
deck_scale = 10000
review_markov_transition = false
torch_device = "cuda"
action_retentions = [0.5, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.93, 0.96, 0.98]
formal_eval_cost_weights = [0, 1, 2, 4, 8, 16, 32, 48, 64, 96, 128, 192, 256, 320, 384, 512, 1024]
dense_loww_eval_cost_weights = [0, 0.0625, 0.125, 0.25, 0.5, 0.75, 1, 1.5, 2, 3, 4, 6, 8, 12, 16, 24, 32, 48, 64, 96, 128, 192, 256, 320, 384, 512, 1024]

[training]
per_user_models = true
per_user_supervision = "uniform_table"
network = "residual"
hidden_size = 8
network_depth = 2
oracle_s_grid_size = 64
oracle_d_grid_size = 32
epochs = 128
steps_per_epoch = 64
table_samples_per_weight = 256
eval_particles = 10000

[fsrs6_adr]
train_run_root = "artifacts/rl_scheduler/fsrs6_adr_portfolio_users_1_8/fsrs6_adr_portfolio_users_1_8_pop16_v1_markov_off"

[[treatments]]
label = "sparse_baseline"
training_cost_weights = [0, 16, 64, 256, 1024]
out_dir = "artifacts/single_card_tradeoff/stationary_finite_distill_train_weights_sparse_first8_markov_off"

[[treatments]]
label = "add_1_4"
training_cost_weights = [0, 1, 4, 16, 64, 256, 1024]
out_dir = "artifacts/single_card_tradeoff/stationary_finite_distill_train_weights_add_1_4_first8_markov_off"

[[treatments]]
label = "add_1_only"
training_cost_weights = [0, 1, 16, 64, 256, 1024]
out_dir = "artifacts/single_card_tradeoff/stationary_finite_distill_train_weights_add_1_only_first8_markov_off"

[[treatments]]
label = "add_4_only"
training_cost_weights = [0, 4, 16, 64, 256, 1024]
out_dir = "artifacts/single_card_tradeoff/stationary_finite_distill_train_weights_add_4_only_first8_markov_off"

[[treatments]]
label = "add_1_2_4"
training_cost_weights = [0, 1, 2, 4, 16, 64, 256, 1024]
out_dir = "artifacts/single_card_tradeoff/stationary_finite_distill_train_weights_add_1_2_4_first8_markov_off"

[outputs]
comparison_root = "artifacts/single_card_tradeoff/train_weight_1_4_control_markov_off"
formal_exact_value_root = "artifacts/single_card_tradeoff/train_weight_1_4_control_markov_off/exact_value_formal"
dense_loww_exact_value_root = "artifacts/single_card_tradeoff/train_weight_1_4_control_markov_off/exact_value_user2_dense_loww"

[workflow]
candidate_label = "add_4_only"
