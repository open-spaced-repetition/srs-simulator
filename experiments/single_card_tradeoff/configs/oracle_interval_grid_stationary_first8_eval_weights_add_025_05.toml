schema_version = 1
name = "oracle_interval_grid_stationary_first8_eval_weights_add_025_05"
family = "single_card_tradeoff"
seed = 42

[experiment]
env = "fsrs6"
user_ids = [1, 2, 3, 4, 5, 6, 7, 8]
schedulers = ["fsrs6", "fsrs6_oracle_interval", "fsrs6_oracle", "fsrs6_oracle_stationary_finite"]
button_usage = "../Anki-button-usage/button_usage.jsonl"
days = 1825
particles = 10000
deck_scale = 10000
target_retentions = [0.5, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.93, 0.96, 0.98]
oracle_cost_weights = [0, 0.25, 0.5, 1, 2, 4, 8, 16, 32, 48, 64, 96, 128, 192, 256, 320, 384, 512, 1024]
oracle_s_grid_size = 64
oracle_d_grid_size = 32
oracle_interval_chunk_size = 64
torch_device = "cuda"
scheduler_priority = "low_retrievability"
benchmark_partition = "0"
review_markov_transition = false
no_plot = false
no_progress = true

[outputs]
root = "artifacts/single_card_tradeoff/oracle_interval_grid_stationary_first8_eval_weights_add_025_05_markov_off"

[[tasks]]
name = "evaluate_oracle_interval_grid_stationary_first8_add_025_05"
stage = "evaluate"
kind = "tradeoff_config"
description = "Compare fsrs6_oracle_interval, fsrs6_oracle, and fsrs6_oracle_stationary_finite on the first eight FSRS6 users using default eval cost weights plus 0.25 and 0.5."

[tasks.options]
config = "experiments/single_card_tradeoff/configs/oracle_interval_grid_stationary_first8_eval_weights_add_025_05.toml"
