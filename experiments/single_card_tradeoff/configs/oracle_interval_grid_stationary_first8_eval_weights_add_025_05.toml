schema_version = 1
name = "oracle_interval_grid_stationary_first8_eval_weights_add_025_05"
family = "single_card_tradeoff"
seed = 42

[experiment]
env = "fsrs6"
user_ids = [1, 2, 3, 4, 5, 6, 7, 8]
schedulers = [
  "fsrs6",
  "fsrs6_adr",
  "fsrs6_oracle_interval",
  "fsrs6_oracle",
  "fsrs6_oracle_stationary_finite",
  "fsrs6_oracle_stationary_finite_distill",
  "fsrs6_oracle_continuous_retention",
  "fsrs6_oracle_continuous_stationary_finite",
  "fsrs6_oracle_continuous_stationary_finite_distill",
]
button_usage = "../Anki-button-usage/button_usage.jsonl"
days = 1825
particles = 10000
deck_scale = 10000
target_retentions = [0.5, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.93, 0.96, 0.98]
oracle_cost_weights = [0, 0.25, 0.5, 1, 2, 4, 8, 16, 32, 48, 64, 96, 128, 192, 256, 320, 384, 512, 1024]
oracle_s_grid_size = 64
oracle_d_grid_size = 32
oracle_interval_chunk_size = 64
torch_device = "cuda"
scheduler_priority = "low_retrievability"
benchmark_partition = "0"
review_markov_transition = false
no_plot = false
plot_label_mode = "sparse"
no_progress = true

[fsrs6_adr]
train_run_root = "artifacts/single_card_tradeoff/native_adr_first8_eval_weights_add_025_05_markov_off"
lambda_values = [0, 0.25, 0.5, 1, 2, 4, 8, 16, 32, 48, 64, 96, 128, 192, 256, 320, 384, 512, 1024]

[stationary_finite_distill]
policy_template = "artifacts/single_card_tradeoff/stationary_finite_distill_train_weights_add_4_only_first8_markov_off/user_{user_id}_policy.pt"
cost_weights = [0, 0.25, 0.5, 1, 2, 4, 8, 16, 32, 48, 64, 96, 128, 192, 256, 320, 384, 512, 1024]

[continuous_stationary_finite_distill]
policy_template = "artifacts/single_card_tradeoff/continuous_stationary_finite_distill_first8_teacherocc_underpred8_term32_h16/user_{user_id}_policy.pt"
cost_weights = [0, 0.25, 0.5, 1, 2, 4, 8, 16, 32, 48, 64, 96, 128, 192, 256, 320, 384, 512, 1024]

[outputs]
root = "artifacts/single_card_tradeoff/oracle_interval_grid_stationary_first8_eval_weights_add_025_05_markov_off"

[[tasks]]
name = "train_native_adr_first8_add_025_05"
stage = "train"
kind = "fsrs6_adr_train_multiuser"
description = "Train one native single-card FSRS6 ADR policy per first-eight user and evaluation cost weight, including 0.25 and 0.5."

[tasks.options]
env = "fsrs6"
user_ids = "1,2,3,4,5,6,7,8"
cost_weights = "0,0.25,0.5,1,2,4,8,16,32,48,64,96,128,192,256,320,384,512,1024"
button_usage = "../Anki-button-usage/button_usage.jsonl"
benchmark_partition = "0"
days = 1825
population_size = 32
elite_count = 8
generations = 64
train_particles = 1024
eval_particles = 10000
job_batch_size = 8192
torch_device = "cuda"
out_dir = "artifacts/single_card_tradeoff/native_adr_first8_eval_weights_add_025_05_markov_off"
no_progress = true

[[tasks]]
name = "evaluate_oracle_interval_grid_stationary_distill_adr_first8_add_025_05"
stage = "evaluate"
kind = "tradeoff_config"
description = "Compare discrete, interval, stationary finite, and continuous oracle schedulers on the first eight FSRS6 users using default eval cost weights plus 0.25 and 0.5."

[tasks.options]
config = "experiments/single_card_tradeoff/configs/oracle_interval_grid_stationary_first8_eval_weights_add_025_05.toml"
