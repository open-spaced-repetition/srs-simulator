schema_version = 1
name = "stationary_finite_first8_report"
family = "single_card_tradeoff"
seed = 42

[report]
root = "artifacts/single_card_tradeoff/reports/current"
output_path = "docs/rl_scheduler/experiments/2026-05-17-single_card_tradeoff.md"

[source_artifacts]
default_regret_auc = "artifacts/single_card_tradeoff/no_sub05_distill_compare/regret_auc.csv"
default_results = "artifacts/single_card_tradeoff/no_sub05_distill_compare/results.csv"
first8_distill_summary = "artifacts/single_card_tradeoff/stationary_finite_distill_first8_users_per_user_uniform_table_supervision_fsrs6_baseline_gpu/summary.csv"
first8_distill_train_summary = "artifacts/single_card_tradeoff/stationary_finite_distill_first8_users_per_user_uniform_table_supervision_fsrs6_baseline_gpu/train_summary.csv"
first8_exact_vs_distill_mean_summary = "artifacts/single_card_tradeoff/stationary_finite_exact_vs_distill_first8_users/mean_summary.csv"
first8_exact_vs_distill_regret_auc = "artifacts/single_card_tradeoff/stationary_finite_exact_vs_distill_first8_users/regret_auc.csv"
low_param_sparse_metadata = "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users/metadata.json"
low_param_dense_metadata = "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_dense_weights/metadata.json"

[experiment]
env = "fsrs6"
user_ids = [1, 2, 3, 4, 5, 6, 7, 8]
button_usage = "../Anki-button-usage/button_usage.jsonl"
days = 1825
deck_scale = 10000
target_retentions = [0.5, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.93, 0.96, 0.98]
teacher_cost_weights = [0, 16, 64, 256, 1024]
eval_cost_weights = [0, 1, 2, 4, 8, 16, 32, 48, 64, 96, 128, 192, 256, 320, 384, 512, 1024]
torch_device = "cuda"

[[commands]]
name = "evaluate_default_no_sub05_tradeoff"
description = "Evaluate the default fsrs6 single-card compact-policy comparison with no sub-0.5 actions."
command = [
  "uv",
  "run",
  "experiments/single_card_tradeoff/tradeoff.py",
  "--env",
  "fsrs6_default",
  "--sched",
  "fsrs6_default,fsrs6_oracle_distill,fsrs6_oracle_stationary_finite_distill,fsrs6_oracle_retention_distill,fsrs6_oracle_infinite_distill,uvfa_ppo,uvfa_ppo_rnn_interval",
  "--particles",
  "10000",
  "--deck-scale",
  "10000",
  "--oracle-distill-policy",
  "artifacts/single_card_tradeoff/fsrs6_oracle_distill_policy.pt",
  "--oracle-stationary-finite-distill-policy",
  "artifacts/single_card_tradeoff/fsrs6_oracle_stationary_finite_distill_policy.pt",
  "--oracle-retention-distill-policy",
  "artifacts/single_card_tradeoff/fsrs6_oracle_retention_distill_policy.pt",
  "--oracle-infinite-distill-policy",
  "artifacts/single_card_tradeoff/fsrs6_oracle_infinite_distill_policy.pt",
  "--uvfa-ppo-policy",
  "artifacts/single_card_tradeoff/uvfa_ppo_policy.pt",
  "--uvfa-ppo-rnn-interval-policy",
  "artifacts/single_card_tradeoff/uvfa_ppo_rnn_interval_policy.pt",
  "--out",
  "artifacts/single_card_tradeoff/no_sub05_distill_compare/results.csv",
  "--plot-path",
  "artifacts/single_card_tradeoff/no_sub05_distill_compare/results.png",
  "--regret-auc-out",
  "artifacts/single_card_tradeoff/no_sub05_distill_compare/regret_auc.csv",
  "--torch-device",
  "cuda",
]
expected_outputs = [
  "artifacts/single_card_tradeoff/no_sub05_distill_compare/results.csv",
  "artifacts/single_card_tradeoff/no_sub05_distill_compare/regret_auc.csv",
  "artifacts/single_card_tradeoff/no_sub05_distill_compare/results.png",
  "artifacts/single_card_tradeoff/no_sub05_distill_compare/performance_summary.json",
  "artifacts/single_card_tradeoff/no_sub05_distill_compare/gpu_monitor/summary.json",
]

[[commands]]
name = "train_first8_stationary_finite_distill"
description = "Train one 476-parameter stationary finite distill per user with uniform exact-table supervision."
command = [
  "uv",
  "run",
  "experiments/single_card_tradeoff/oracle_stationary_finite_distill_multiuser.py",
  "--env",
  "fsrs6",
  "--user-ids",
  "1,2,3,4,5,6,7,8",
  "--button-usage",
  "../Anki-button-usage/button_usage.jsonl",
  "--per-user-models",
  "--per-user-supervision",
  "uniform_table",
  "--out-dir",
  "artifacts/single_card_tradeoff/stationary_finite_distill_first8_users_per_user_uniform_table_supervision_fsrs6_baseline_gpu",
  "--torch-device",
  "cuda",
  "--no-progress",
]
expected_outputs = [
  "artifacts/single_card_tradeoff/stationary_finite_distill_first8_users_per_user_uniform_table_supervision_fsrs6_baseline_gpu/train_summary.csv",
  "artifacts/single_card_tradeoff/stationary_finite_distill_first8_users_per_user_uniform_table_supervision_fsrs6_baseline_gpu/summary.csv",
  "artifacts/single_card_tradeoff/stationary_finite_distill_first8_users_per_user_uniform_table_supervision_fsrs6_baseline_gpu/regret_auc.csv",
  "artifacts/single_card_tradeoff/stationary_finite_distill_first8_users_per_user_uniform_table_supervision_fsrs6_baseline_gpu/performance_summary.json",
  "artifacts/single_card_tradeoff/stationary_finite_distill_first8_users_per_user_uniform_table_supervision_fsrs6_baseline_gpu/gpu_monitor/summary.json",
]

[[commands]]
name = "evaluate_first8_stationary_finite_distill"
description = "Evaluate the per-user stationary finite distill against fsrs6 on the first eight users."
command = [
  "uv",
  "run",
  "experiments/single_card_tradeoff/oracle_stationary_finite_distill_multiuser.py",
  "--env",
  "fsrs6",
  "--user-ids",
  "1,2,3,4,5,6,7,8",
  "--button-usage",
  "../Anki-button-usage/button_usage.jsonl",
  "--per-user-models",
  "--out-dir",
  "artifacts/single_card_tradeoff/stationary_finite_distill_first8_users_per_user_uniform_table_supervision_fsrs6_baseline_gpu",
  "--torch-device",
  "cuda",
  "--no-progress",
]
expected_outputs = [
  "artifacts/single_card_tradeoff/stationary_finite_distill_first8_users_per_user_uniform_table_supervision_fsrs6_baseline_gpu/summary.csv",
  "artifacts/single_card_tradeoff/stationary_finite_distill_first8_users_per_user_uniform_table_supervision_fsrs6_baseline_gpu/regret_auc.csv",
  "artifacts/single_card_tradeoff/stationary_finite_distill_first8_users_per_user_uniform_table_supervision_fsrs6_baseline_gpu/performance_summary.json",
  "artifacts/single_card_tradeoff/stationary_finite_distill_first8_users_per_user_uniform_table_supervision_fsrs6_baseline_gpu/gpu_monitor/summary.json",
]

[[commands]]
name = "evaluate_first8_exact_vs_distill"
description = "Evaluate exact stationary finite policies and per-user distill checkpoints against fsrs6 on the first eight users."
command = [
  "uv",
  "run",
  "experiments/single_card_tradeoff/oracle_stationary_finite_distill_multiuser.py",
  "--env",
  "fsrs6",
  "--user-ids",
  "1,2,3,4,5,6,7,8",
  "--button-usage",
  "../Anki-button-usage/button_usage.jsonl",
  "--eval-exact-vs-distill",
  "--distill-dir",
  "artifacts/single_card_tradeoff/stationary_finite_distill_first8_users_per_user_uniform_table_supervision_fsrs6_baseline_gpu",
  "--out-dir",
  "artifacts/single_card_tradeoff/stationary_finite_exact_vs_distill_first8_users",
  "--torch-device",
  "cuda",
  "--no-progress",
]
expected_outputs = [
  "artifacts/single_card_tradeoff/stationary_finite_exact_vs_distill_first8_users/mean_summary.csv",
  "artifacts/single_card_tradeoff/stationary_finite_exact_vs_distill_first8_users/summary.csv",
  "artifacts/single_card_tradeoff/stationary_finite_exact_vs_distill_first8_users/regret_auc.csv",
  "artifacts/single_card_tradeoff/stationary_finite_exact_vs_distill_first8_users/performance_summary.json",
  "artifacts/single_card_tradeoff/stationary_finite_exact_vs_distill_first8_users/gpu_monitor/summary.json",
]

[[commands]]
name = "train_low_param_direct_sparse"
description = "Train the 7-parameter direct policy-search compression baseline using sparse teacher cost weights."
command = [
  "uv",
  "run",
  "experiments/single_card_tradeoff/low_param_direct_policy_search_multiuser.py",
  "--env",
  "fsrs6",
  "--user-ids",
  "1,2,3,4,5,6,7,8",
  "--button-usage",
  "../Anki-button-usage/button_usage.jsonl",
  "--generations",
  "64",
  "--population-size",
  "32",
  "--elite-count",
  "8",
  "--train-particles",
  "64",
  "--eval-particles",
  "10000",
  "--torch-device",
  "cuda",
  "--out-dir",
  "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users",
  "--no-progress",
]
expected_outputs = [
  "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users/metadata.json",
  "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users/mean_summary.csv",
  "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users/regret_auc.csv",
  "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users/performance_summary.json",
  "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users/gpu_monitor/summary.json",
]

[[commands]]
name = "train_low_param_direct_dense"
description = "Rerun the 7-parameter direct-search baseline with dense teacher cost weights."
command = [
  "uv",
  "run",
  "experiments/single_card_tradeoff/low_param_direct_policy_search_multiuser.py",
  "--env",
  "fsrs6",
  "--user-ids",
  "1,2,3,4,5,6,7,8",
  "--button-usage",
  "../Anki-button-usage/button_usage.jsonl",
  "--generations",
  "64",
  "--population-size",
  "32",
  "--elite-count",
  "8",
  "--train-particles",
  "64",
  "--eval-particles",
  "10000",
  "--train-cost-weights",
  "0,1,2,4,8,16,32,48,64,96,128,192,256,320,384,512,1024",
  "--torch-device",
  "cuda",
  "--out-dir",
  "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_dense_weights",
  "--no-progress",
]
expected_outputs = [
  "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_dense_weights/metadata.json",
  "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_dense_weights/mean_summary.csv",
  "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_dense_weights/regret_auc.csv",
  "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_dense_weights/performance_summary.json",
  "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_dense_weights/gpu_monitor/summary.json",
]

[[commands]]
name = "generate_report"
description = "Generate the formal report from the configured artifacts."
command = [
  "uv",
  "run",
  "python",
  "experiments/single_card_tradeoff/generate_experiment_report.py",
  "--config",
  "experiments/single_card_tradeoff/configs/stationary_finite_first8_report.toml",
]
expected_outputs = [
  "artifacts/single_card_tradeoff/reports/current/report_summary.json",
  "artifacts/single_card_tradeoff/reports/current/report.md",
  "docs/rl_scheduler/experiments/2026-05-17-single_card_tradeoff.md",
]
