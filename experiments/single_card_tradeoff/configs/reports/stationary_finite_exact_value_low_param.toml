schema_version = 1
name = "stationary_finite_exact_value_low_param"
family = "single_card_tradeoff"
seed = 42

[report.outputs]
stationary_finite_exact_value_low_param = "docs/single_card_tradeoff/experiments/2026-05-18-stationary_finite_exact_value_low_param.md"

[source_artifacts]
stationary_finite_exact_value_mean_summary = "artifacts/single_card_tradeoff/stationary_finite_exact_value_first8_users/mean_summary.csv"
stationary_finite_exact_value_regret_auc = "artifacts/single_card_tradeoff/stationary_finite_exact_value_first8_users/regret_auc.csv"
stationary_finite_exact_value_metadata = "artifacts/single_card_tradeoff/stationary_finite_exact_value_first8_users/metadata.json"
low_param_direct_interaction15_metadata = "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_interaction15/metadata.json"
low_param_direct_basis32_metadata = "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_basis32/metadata.json"
low_param_direct_basis64_metadata = "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_basis64/metadata.json"

[[commands]]
name = "evaluate_stationary_finite_exact_value_first8"
description = "Deterministically evaluate exact stationary finite tables and discretized first-eight distill/direct policies."
command = [
  "uv",
  "run",
  "python",
  "experiments/single_card_tradeoff/stationary_finite_exact_value_eval.py",
  "--env",
  "fsrs6",
  "--user-ids",
  "1,2,3,4,5,6,7,8",
  "--button-usage",
  "../Anki-button-usage/button_usage.jsonl",
  "--torch-device",
  "cuda",
  "--out-dir",
  "artifacts/single_card_tradeoff/stationary_finite_exact_value_first8_users",
  "--direct-policy",
  "direct_15_interaction=artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_interaction15/policy.pt",
  "--direct-policy",
  "direct_32_basis=artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_basis32/policy.pt",
  "--direct-policy",
  "direct_64_basis=artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_basis64/policy.pt",
  "--no-progress",
]
expected_outputs = [
  "artifacts/single_card_tradeoff/stationary_finite_exact_value_first8_users/results.csv",
  "artifacts/single_card_tradeoff/stationary_finite_exact_value_first8_users/regret_auc.csv",
  "artifacts/single_card_tradeoff/stationary_finite_exact_value_first8_users/summary.csv",
  "artifacts/single_card_tradeoff/stationary_finite_exact_value_first8_users/mean_summary.csv",
  "artifacts/single_card_tradeoff/stationary_finite_exact_value_first8_users/metadata.json",
  "artifacts/single_card_tradeoff/stationary_finite_exact_value_first8_users/gpu_monitor/summary.json",
]

[[commands]]
name = "train_low_param_direct_interaction15"
description = "Train the 15-parameter monotone interaction direct-search policy on first-eight users."
command = [
  "uv",
  "run",
  "python",
  "experiments/single_card_tradeoff/low_param_direct_policy_search_multiuser.py",
  "--env",
  "fsrs6",
  "--user-ids",
  "1,2,3,4,5,6,7,8",
  "--button-usage",
  "../Anki-button-usage/button_usage.jsonl",
  "--policy-family",
  "interaction15_monotone",
  "--generations",
  "64",
  "--population-size",
  "32",
  "--elite-count",
  "8",
  "--train-particles",
  "64",
  "--eval-particles",
  "10000",
  "--torch-device",
  "cuda",
  "--out-dir",
  "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_interaction15",
  "--no-progress",
]
expected_outputs = [
  "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_interaction15/policy.pt",
  "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_interaction15/metadata.json",
  "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_interaction15/mean_summary.csv",
  "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_interaction15/regret_auc.csv",
  "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_interaction15/gpu_monitor/summary.json",
]

