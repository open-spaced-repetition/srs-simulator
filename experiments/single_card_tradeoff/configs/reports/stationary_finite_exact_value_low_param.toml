schema_version = 1
name = "stationary_finite_exact_value_low_param"
family = "single_card_tradeoff"
seed = 42

[report]

[report.outputs]
stationary_finite_exact_value_low_param = "docs/single_card_tradeoff/experiments/2026-05-18-stationary_finite_exact_value_low_param.md"

[source_artifacts]
stationary_finite_exact_value_mean_summary = "artifacts/single_card_tradeoff/stationary_finite_exact_value_first8_users/mean_summary.csv"
stationary_finite_exact_value_regret_auc = "artifacts/single_card_tradeoff/stationary_finite_exact_value_first8_users/regret_auc.csv"
stationary_finite_exact_value_metadata = "artifacts/single_card_tradeoff/stationary_finite_exact_value_first8_users/metadata.json"
first8_exact_vs_distill_mean_summary = "artifacts/single_card_tradeoff/stationary_finite_exact_vs_distill_first8_users/mean_summary.csv"
first8_exact_vs_distill_regret_auc = "artifacts/single_card_tradeoff/stationary_finite_exact_vs_distill_first8_users/regret_auc.csv"
low_param_direct_interaction15_metadata = "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_interaction15/metadata.json"
low_param_direct_basis32_metadata = "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_basis32/metadata.json"
low_param_direct_basis64_metadata = "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_basis64/metadata.json"

[[tasks]]
name = "evaluate_stationary_finite_exact_value_first8"
stage = "evaluate"
kind = "stationary_finite_exact_value_eval"
description = "Deterministically evaluate exact stationary finite tables and discretized first-eight distill/direct policies."

[tasks.options]
env = "fsrs6"
user_ids = "1,2,3,4,5,6,7,8"
button_usage = "../Anki-button-usage/button_usage.jsonl"
torch_device = "cuda"
out_dir = "artifacts/single_card_tradeoff/stationary_finite_exact_value_first8_users"
direct_policy = ["direct_15_interaction=artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_interaction15/policy.pt", "direct_32_basis=artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_basis32/policy.pt", "direct_64_basis=artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_basis64/policy.pt"]
no_progress = true

[[tasks]]
name = "train_low_param_direct_interaction15"
stage = "train"
kind = "low_param_direct_policy_search_multiuser"
description = "Train the 15-parameter monotone interaction direct-search policy on first-eight users."

[tasks.options]
env = "fsrs6"
user_ids = "1,2,3,4,5,6,7,8"
button_usage = "../Anki-button-usage/button_usage.jsonl"
policy_family = "interaction15_monotone"
generations = 64
population_size = 32
elite_count = 8
train_particles = 64
eval_particles = 10000
torch_device = "cuda"
out_dir = "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_interaction15"
no_progress = true

[[tasks]]
name = "train_low_param_direct_basis32"
stage = "train"
kind = "low_param_direct_policy_search_multiuser"
description = "Train the 32-parameter monotone basis direct-search policy on first-eight users."

[tasks.options]
env = "fsrs6"
user_ids = "1,2,3,4,5,6,7,8"
button_usage = "../Anki-button-usage/button_usage.jsonl"
policy_family = "basis32_monotone"
generations = 64
population_size = 32
elite_count = 8
train_particles = 64
eval_particles = 10000
torch_device = "cuda"
out_dir = "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_basis32"
no_progress = true

[[tasks]]
name = "train_low_param_direct_basis64"
stage = "train"
kind = "low_param_direct_policy_search_multiuser"
description = "Train the 64-parameter monotone basis direct-search policy on first-eight users."

[tasks.options]
env = "fsrs6"
user_ids = "1,2,3,4,5,6,7,8"
button_usage = "../Anki-button-usage/button_usage.jsonl"
policy_family = "basis64_monotone"
generations = 64
population_size = 32
elite_count = 8
train_particles = 64
eval_particles = 10000
torch_device = "cuda"
out_dir = "artifacts/single_card_tradeoff/low_param_direct_policy_search_first8_users_basis64"
no_progress = true
