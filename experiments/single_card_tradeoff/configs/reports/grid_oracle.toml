schema_version = 1
name = "grid_oracle"
family = "single_card_tradeoff"
seed = 42

[report]

[report.outputs]
grid_oracle = "docs/single_card_tradeoff/experiments/2026-05-17-grid_oracle.md"

[source_artifacts]
grid_oracle_regret_auc = "artifacts/single_card_tradeoff/results_regret_auc.csv"

[[tasks]]
name = "evaluate_grid_oracle_compare"
stage = "evaluate"
kind = "tradeoff"
description = "Evaluate finite exact and stationary finite exact grid oracles against fsrs6_default."

[tasks.options]
env = "fsrs6_default"
sched = "fsrs6_default,fsrs6_oracle,fsrs6_oracle_stationary_finite"
particles = 10000
deck_scale = 10000
out = "artifacts/single_card_tradeoff/results.csv"
regret_auc_out = "artifacts/single_card_tradeoff/results_regret_auc.csv"
torch_device = "cuda"
