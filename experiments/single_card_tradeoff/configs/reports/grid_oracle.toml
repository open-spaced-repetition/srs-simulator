schema_version = 1
name = "grid_oracle"
family = "single_card_tradeoff"
seed = 42

[report.outputs]
grid_oracle = "docs/single_card_tradeoff/experiments/2026-05-17-grid_oracle.md"

[source_artifacts]
grid_oracle_regret_auc = "artifacts/single_card_tradeoff/results_regret_auc.csv"

[[commands]]
name = "evaluate_grid_oracle_compare"
description = "Evaluate finite exact and stationary finite exact grid oracles against fsrs6_default."
command = [
  "uv",
  "run",
  "-m", "experiments.single_card_tradeoff.cli.tradeoff",
  "--env",
  "fsrs6_default",
  "--sched",
  "fsrs6_default,fsrs6_oracle,fsrs6_oracle_stationary_finite",
  "--particles",
  "10000",
  "--deck-scale",
  "10000",
  "--out",
  "artifacts/single_card_tradeoff/results.csv",
  "--regret-auc-out",
  "artifacts/single_card_tradeoff/results_regret_auc.csv",
  "--torch-device",
  "cuda",
]
expected_outputs = [
  "artifacts/single_card_tradeoff/results.csv",
  "artifacts/single_card_tradeoff/results_regret_auc.csv",
]

