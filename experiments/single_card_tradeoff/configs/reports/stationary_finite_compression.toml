schema_version = 1
name = "stationary_finite_compression"
family = "single_card_tradeoff"
seed = 42

[report]

[report.outputs]
stationary_finite_compression = "docs/single_card_tradeoff/experiments/2026-05-17-stationary_finite_compression.md"

[source_artifacts]
stationary_finite_cost_weight_ablation = "artifacts/single_card_tradeoff/stationary_finite_cost_weight_ablation/cost_weight_ablation_multiseed_summary.csv"
stationary_finite_model_size_ablation = "artifacts/single_card_tradeoff/stationary_finite_model_size_ablation/model_size_ablation_summary.csv"
stationary_finite_model_size_sub216_ablation = "artifacts/single_card_tradeoff/stationary_finite_model_size_ablation/sub216_summary.csv"

[[tasks]]
name = "rerun_stationary_finite_model_size_ablation"
stage = "train"
kind = "stationary_finite_model_size_ablation"
description = "Rerun the stationary finite model-size ablation with the current default distillation recipe."

[tasks.options]
torch_device = "cuda"
no_progress = true

[[tasks]]
name = "rerun_stationary_finite_sub216_model_size_ablation"
stage = "train"
kind = "stationary_finite_model_size_ablation"
description = "Run the quick sub-216 stationary finite compression sweep with smaller residual, MLP, and structured policies."

[tasks.options]
torch_device = "cuda"
candidate_set = "sub216"
summary_prefix = "sub216"
no_progress = true
