schema_version = 1
name = "oracle_policy_outputs"
family = "single_card_tradeoff"
seed = 42

[report.outputs]
oracle_policy_outputs = "docs/single_card_tradeoff/experiments/2026-05-17-oracle_policy_outputs.md"

[source_artifacts]
oracle_policy_outputs_rollout = "artifacts/single_card_tradeoff/analysis/no_sub05_fsrs6_oracle_policy_outputs_rollout_1825_p2048.csv"
oracle_policy_outputs_table = "artifacts/single_card_tradeoff/analysis/no_sub05_fsrs6_oracle_policy_outputs_table_1825.csv"
oracle_policy_outputs_rollout_detail = "artifacts/single_card_tradeoff/analysis/no_sub05_fsrs6_oracle_policy_outputs_rollout_1825_p2048_detail.csv"
oracle_policy_outputs_table_detail = "artifacts/single_card_tradeoff/analysis/no_sub05_fsrs6_oracle_policy_outputs_table_1825_detail.csv"

[[commands]]
name = "analyze_oracle_policy_outputs_rollout"
description = "Rerun finite oracle output-distribution analysis with the clipped action grid."
command = [
  "uv",
  "run",
  "-m", "experiments.single_card_tradeoff.cli.oracle_policy_outputs",
  "--source",
  "rollout",
  "--days",
  "1825",
  "--s-grid-size",
  "64",
  "--d-grid-size",
  "32",
  "--cost-weights",
  "0,16,64,256,1024",
  "--action-retentions",
  "0.5,0.6,0.65,0.7,0.75,0.8,0.85,0.9,0.93,0.96,0.98",
  "--particles",
  "2048",
  "--out",
  "artifacts/single_card_tradeoff/analysis/no_sub05_fsrs6_oracle_policy_outputs_rollout_1825_p2048.csv",
  "--detail-out",
  "artifacts/single_card_tradeoff/analysis/no_sub05_fsrs6_oracle_policy_outputs_rollout_1825_p2048_detail.csv",
  "--plot-path",
  "artifacts/single_card_tradeoff/analysis/no_sub05_fsrs6_oracle_policy_outputs_rollout_1825_p2048.png",
  "--torch-device",
  "cuda",
  "--no-progress",
]
expected_outputs = [
  "artifacts/single_card_tradeoff/analysis/no_sub05_fsrs6_oracle_policy_outputs_rollout_1825_p2048.csv",
  "artifacts/single_card_tradeoff/analysis/no_sub05_fsrs6_oracle_policy_outputs_rollout_1825_p2048_detail.csv",
  "artifacts/single_card_tradeoff/analysis/no_sub05_fsrs6_oracle_policy_outputs_rollout_1825_p2048.png",
]

[[commands]]
name = "analyze_oracle_policy_outputs_table"
description = "Rerun finite oracle table-weighted output-distribution analysis with the clipped action grid."
command = [
  "uv",
  "run",
  "-m", "experiments.single_card_tradeoff.cli.oracle_policy_outputs",
  "--source",
  "table",
  "--days",
  "1825",
  "--s-grid-size",
  "64",
  "--d-grid-size",
  "32",
  "--cost-weights",
  "0,16,64,256,1024",
  "--action-retentions",
  "0.5,0.6,0.65,0.7,0.75,0.8,0.85,0.9,0.93,0.96,0.98",
  "--out",
  "artifacts/single_card_tradeoff/analysis/no_sub05_fsrs6_oracle_policy_outputs_table_1825.csv",
  "--detail-out",
  "artifacts/single_card_tradeoff/analysis/no_sub05_fsrs6_oracle_policy_outputs_table_1825_detail.csv",
  "--plot-path",
  "artifacts/single_card_tradeoff/analysis/no_sub05_fsrs6_oracle_policy_outputs_table_1825.png",
  "--torch-device",
  "cuda",
  "--no-progress",
]
expected_outputs = [
  "artifacts/single_card_tradeoff/analysis/no_sub05_fsrs6_oracle_policy_outputs_table_1825.csv",
  "artifacts/single_card_tradeoff/analysis/no_sub05_fsrs6_oracle_policy_outputs_table_1825_detail.csv",
  "artifacts/single_card_tradeoff/analysis/no_sub05_fsrs6_oracle_policy_outputs_table_1825.png",
]
