schema_version = 1
name = "uvfa_ppo"
family = "single_card_tradeoff"
seed = 42

[report]

[report.outputs]
uvfa_ppo = "docs/single_card_tradeoff/experiments/2026-05-17-uvfa_ppo.md"

[source_artifacts]
uvfa_ppo_hparam_summary = "artifacts/single_card_tradeoff/uvfa_ppo_hparam_search_summary.csv"
uvfa_ppo_results = "artifacts/single_card_tradeoff/uvfa_ppo_results.csv"

[[tasks]]
name = "search_uvfa_ppo_hparams"
stage = "train"
kind = "uvfa_ppo_hparam_search"
description = "Rerun the discrete UVFA PPO model-size search."

[tasks.options]
days = 1825
eval_particles = 3000
save_models = true
torch_device = "cuda"
no_progress = true
