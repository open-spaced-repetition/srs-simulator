schema_version = 1
name = "uvfa_ppo"
family = "single_card_tradeoff"
seed = 42

[report.outputs]
uvfa_ppo = "docs/single_card_tradeoff/experiments/2026-05-17-uvfa_ppo.md"

[source_artifacts]
uvfa_ppo_hparam_summary = "artifacts/single_card_tradeoff/uvfa_ppo_hparam_search_summary.csv"
uvfa_ppo_results = "artifacts/single_card_tradeoff/uvfa_ppo_results.csv"

[[commands]]
name = "search_uvfa_ppo_hparams"
description = "Rerun the discrete UVFA PPO model-size search."
command = [
  "uv",
  "run",
  "-m", "experiments.single_card_tradeoff.cli.uvfa_ppo_hparam_search",
  "--days",
  "1825",
  "--eval-particles",
  "3000",
  "--save-models",
  "--torch-device",
  "cuda",
  "--no-progress",
]
expected_outputs = [
  "artifacts/single_card_tradeoff/uvfa_ppo_hparam_search_summary.csv",
  "artifacts/single_card_tradeoff/uvfa_ppo_hparam_search_detail.csv",
  "artifacts/single_card_tradeoff/uvfa_ppo_hparam_search_models",
]

