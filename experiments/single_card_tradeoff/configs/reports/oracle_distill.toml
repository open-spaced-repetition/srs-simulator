schema_version = 1
name = "oracle_distill"
family = "single_card_tradeoff"
seed = 42

[report]

[report.outputs]
oracle_distill = "docs/single_card_tradeoff/experiments/2026-05-17-oracle_distill.md"

[source_artifacts]
oracle_distill_results = "artifacts/single_card_tradeoff/fsrs6_oracle_distill_results.csv"
oracle_distill_hparam_summary = "artifacts/single_card_tradeoff/fsrs6_oracle_distill_hparam_summary.csv"

[[tasks]]
name = "search_oracle_distill_hparams"
stage = "train"
kind = "oracle_distill_hparam_search"
description = "Rerun the discrete oracle-distill model-size search."

[tasks.options]
days = 1825
oracle_s_grid_size = 64
oracle_d_grid_size = 32
eval_particles = 3000
save_models = true
torch_device = "cuda"
no_progress = true
