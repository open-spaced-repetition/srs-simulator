schema_version = 1
name = "stationary_finite_policy_viz"
family = "single_card_tradeoff"
seed = 42

[report]

[report.outputs]
stationary_finite_policy_viz = "docs/single_card_tradeoff/experiments/2026-05-17-stationary_finite_policy_viz.md"

[source_artifacts]
stationary_finite_policy_action_summary = "artifacts/single_card_tradeoff/stationary_finite_policy_viz/action_summary.csv"
stationary_finite_policy_distill_comparison = "artifacts/single_card_tradeoff/stationary_finite_policy_viz/distill_exact_comparison.csv"
stationary_finite_policy_findings = "artifacts/single_card_tradeoff/stationary_finite_policy_viz/findings.md"

[[tasks]]
name = "visualize_stationary_finite_policy"
stage = "visualize"
kind = "oracle_stationary_finite_policy_viz"
description = "Visualize the clipped exact stationary finite policy and compare it with its distill."

[tasks.options]
days = 1825
s_grid_size = 64
d_grid_size = 32
cost_weights = "0,16,64,256,1024"
action_retentions = "0.5,0.6,0.65,0.7,0.75,0.8,0.85,0.9,0.93,0.96,0.98"
distill_policy = ["artifacts/single_card_tradeoff/fsrs6_oracle_stationary_finite_distill_policy.pt"]
