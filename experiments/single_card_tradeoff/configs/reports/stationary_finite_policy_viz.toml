schema_version = 1
name = "stationary_finite_policy_viz"
family = "single_card_tradeoff"
seed = 42

[report.outputs]
stationary_finite_policy_viz = "docs/single_card_tradeoff/experiments/2026-05-17-stationary_finite_policy_viz.md"

[source_artifacts]
stationary_finite_policy_action_summary = "artifacts/single_card_tradeoff/stationary_finite_policy_viz/action_summary.csv"
stationary_finite_policy_distill_comparison = "artifacts/single_card_tradeoff/stationary_finite_policy_viz/distill_exact_comparison.csv"
stationary_finite_policy_findings = "artifacts/single_card_tradeoff/stationary_finite_policy_viz/findings.md"

[[commands]]
name = "visualize_stationary_finite_policy"
description = "Visualize the clipped exact stationary finite policy and compare it with its distill."
command = [
  "uv",
  "run",
  "experiments/single_card_tradeoff/oracle_stationary_finite_policy_viz.py",
  "--days",
  "1825",
  "--s-grid-size",
  "64",
  "--d-grid-size",
  "32",
  "--cost-weights",
  "0,16,64,256,1024",
  "--action-retentions",
  "0.5,0.6,0.65,0.7,0.75,0.8,0.85,0.9,0.93,0.96,0.98",
  "--distill-policy",
  "artifacts/single_card_tradeoff/fsrs6_oracle_stationary_finite_distill_policy.pt",
]
expected_outputs = [
  "artifacts/single_card_tradeoff/stationary_finite_policy_viz/action_summary.csv",
  "artifacts/single_card_tradeoff/stationary_finite_policy_viz/binned_actions.csv",
  "artifacts/single_card_tradeoff/stationary_finite_policy_viz/grid_actions.csv",
  "artifacts/single_card_tradeoff/stationary_finite_policy_viz/findings.md",
  "artifacts/single_card_tradeoff/stationary_finite_policy_viz/distill_exact_comparison.csv",
  "artifacts/single_card_tradeoff/stationary_finite_policy_viz/action_distribution.png",
  "artifacts/single_card_tradeoff/stationary_finite_policy_viz/policy_heatmaps.png",
]

