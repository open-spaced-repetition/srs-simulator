schema_version = 1
name = "oracle_stationary_finite_cpu_gpu_benchmark"
family = "single_card_tradeoff"
seed = 42

[report.outputs]
oracle_stationary_finite_cpu_gpu_benchmark = "docs/single_card_tradeoff/experiments/2026-05-18-oracle_stationary_finite_cpu_gpu_benchmark.md"

[source_artifacts]
oracle_stationary_finite_cpu_gpu_summary = "artifacts/single_card_tradeoff/oracle_stationary_finite_cpu_gpu_benchmark/summary.csv"
oracle_stationary_finite_cpu_gpu_runs = "artifacts/single_card_tradeoff/oracle_stationary_finite_cpu_gpu_benchmark/runs.csv"
oracle_stationary_finite_cpu_gpu_metadata = "artifacts/single_card_tradeoff/oracle_stationary_finite_cpu_gpu_benchmark/metadata.json"
oracle_stationary_finite_multiuser_cpu_gpu_summary = "artifacts/single_card_tradeoff/oracle_stationary_finite_multiuser_cpu_gpu_benchmark/summary.csv"
oracle_stationary_finite_multiuser_cpu_gpu_runs = "artifacts/single_card_tradeoff/oracle_stationary_finite_multiuser_cpu_gpu_benchmark/runs.csv"
oracle_stationary_finite_multiuser_cpu_gpu_metadata = "artifacts/single_card_tradeoff/oracle_stationary_finite_multiuser_cpu_gpu_benchmark/metadata.json"

[[commands]]
name = "benchmark_oracle_stationary_finite_cpu_gpu"
description = "Benchmark oracle_stationary_finite_distill.py with the formal default workload on CPU and CUDA."
command = [
  "uv",
  "run",
  "python",
  "experiments/single_card_tradeoff/oracle_stationary_finite_cpu_gpu_benchmark.py",
  "--devices",
  "cpu,cuda",
  "--repeats",
  "1",
  "--no-progress",
]
expected_outputs = [
  "artifacts/single_card_tradeoff/oracle_stationary_finite_cpu_gpu_benchmark/summary.csv",
  "artifacts/single_card_tradeoff/oracle_stationary_finite_cpu_gpu_benchmark/runs.csv",
  "artifacts/single_card_tradeoff/oracle_stationary_finite_cpu_gpu_benchmark/metadata.json",
  "artifacts/single_card_tradeoff/oracle_stationary_finite_cpu_gpu_benchmark/cpu/repeat_1/results.csv",
  "artifacts/single_card_tradeoff/oracle_stationary_finite_cpu_gpu_benchmark/cpu/repeat_1/policy.pt",
  "artifacts/single_card_tradeoff/oracle_stationary_finite_cpu_gpu_benchmark/cpu/repeat_1/performance_summary.json",
  "artifacts/single_card_tradeoff/oracle_stationary_finite_cpu_gpu_benchmark/cuda/repeat_1/results.csv",
  "artifacts/single_card_tradeoff/oracle_stationary_finite_cpu_gpu_benchmark/cuda/repeat_1/policy.pt",
  "artifacts/single_card_tradeoff/oracle_stationary_finite_cpu_gpu_benchmark/cuda/repeat_1/performance_summary.json",
  "artifacts/single_card_tradeoff/oracle_stationary_finite_cpu_gpu_benchmark/cuda/repeat_1/gpu_monitor/summary.json",
]

[[commands]]
name = "benchmark_oracle_stationary_finite_multiuser_cpu_gpu"
description = "Benchmark oracle_stationary_finite_distill_multiuser.py with first-eight per-user models on CPU and CUDA."
command = [
  "uv",
  "run",
  "python",
  "experiments/single_card_tradeoff/oracle_stationary_finite_multiuser_cpu_gpu_benchmark.py",
  "--devices",
  "cpu,cuda",
  "--repeats",
  "1",
  "--no-progress",
]
expected_outputs = [
  "artifacts/single_card_tradeoff/oracle_stationary_finite_multiuser_cpu_gpu_benchmark/summary.csv",
  "artifacts/single_card_tradeoff/oracle_stationary_finite_multiuser_cpu_gpu_benchmark/runs.csv",
  "artifacts/single_card_tradeoff/oracle_stationary_finite_multiuser_cpu_gpu_benchmark/metadata.json",
  "artifacts/single_card_tradeoff/oracle_stationary_finite_multiuser_cpu_gpu_benchmark/cpu/repeat_1/results.csv",
  "artifacts/single_card_tradeoff/oracle_stationary_finite_multiuser_cpu_gpu_benchmark/cpu/repeat_1/summary.csv",
  "artifacts/single_card_tradeoff/oracle_stationary_finite_multiuser_cpu_gpu_benchmark/cpu/repeat_1/train_summary.csv",
  "artifacts/single_card_tradeoff/oracle_stationary_finite_multiuser_cpu_gpu_benchmark/cpu/repeat_1/performance_summary.json",
  "artifacts/single_card_tradeoff/oracle_stationary_finite_multiuser_cpu_gpu_benchmark/cuda/repeat_1/results.csv",
  "artifacts/single_card_tradeoff/oracle_stationary_finite_multiuser_cpu_gpu_benchmark/cuda/repeat_1/summary.csv",
  "artifacts/single_card_tradeoff/oracle_stationary_finite_multiuser_cpu_gpu_benchmark/cuda/repeat_1/train_summary.csv",
  "artifacts/single_card_tradeoff/oracle_stationary_finite_multiuser_cpu_gpu_benchmark/cuda/repeat_1/performance_summary.json",
  "artifacts/single_card_tradeoff/oracle_stationary_finite_multiuser_cpu_gpu_benchmark/cuda/repeat_1/gpu_monitor/summary.json",
]
